<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Estimates • HMWSSB Works Portal</title>
  <link rel="stylesheet" href="styles/theme-v2.css">
  <script src="app-v2.js"></script>
</head>
<body>
  <!-- Header Shell Container -->
  <div id="gov-app-header"></div>

  <!-- Breadcrumbs Container -->
  <div id="gov-breadcrumbs"></div>

  <main id="main-content" class="gov-container" style="padding-top: 14px; padding-bottom: 40px;">
    <!-- Page Header -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 12px;">
      <div>
        <h1 style="font-size: 20px; font-weight: 800; color: #1E293B; margin: 0; display:flex; align-items:center; gap:8px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
          My Estimates &amp; Work Files
        </h1>
        <p style="font-size: 13px; color: #64748B; margin: 4px 0 0 0;">
          Manage your departmental estimates, track scrutiny progress, and resolve returned observations.
        </p>
      </div>
      <div>
        <a href="measurement-v2.html" class="btn btn-primary" style="display: inline-flex; align-items: center; gap: 6px; font-weight: 700;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Prepare New Estimate (MB)
        </a>
      </div>
    </div>

    <!-- Status Filter Tabs -->
    <div class="gov-tabs" style="margin-bottom: 16px;">
      <button class="gov-tab-btn active" onclick="switchTab('all', this)">
        All Estimates <span id="tab-count-all" class="badge" style="background:#E2E8F0; color:#475569; margin-left:4px;">0</span>
      </button>
      <button class="gov-tab-btn" onclick="switchTab('draft', this)">
        Drafts <span id="tab-count-draft" class="badge" style="background:#E2E8F0; color:#475569; margin-left:4px;">0</span>
      </button>
      <button class="gov-tab-btn" id="tab-btn-returned" onclick="switchTab('returned', this)" style="display:inline-flex; align-items:center; gap:5px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Returned for Correction <span id="tab-count-returned" class="badge badge-danger" style="margin-left:4px;">0</span>
      </button>
      <button class="gov-tab-btn" onclick="switchTab('scrutiny', this)">
        Under Scrutiny <span id="tab-count-scrutiny" class="badge" style="background:#FEF3C7; color:#92400E; margin-left:4px;">0</span>
      </button>
      <button class="gov-tab-btn" onclick="switchTab('sanctioned', this)">
        Sanctioned <span id="tab-count-sanctioned" class="badge badge-approved" style="margin-left:4px;">0</span>
      </button>
    </div>

    <!-- Search & Filter Toolbar -->
    <div class="card" style="margin-bottom: 16px; padding: 12px 16px;">
      <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
        <div style="flex: 1; min-width: 260px;">
          <input type="text" id="search-input" class="form-control" placeholder="Search by Work Name, File Number, or ID..." oninput="filterAndRender()">
        </div>
        <div style="width: 180px;">
          <select id="division-filter" class="form-control" onchange="filterAndRender()">
            <option value="">All Divisions</option>
          </select>
        </div>
        <button class="btn btn-secondary btn-sm" onclick="resetFilters()">Reset</button>
      </div>
    </div>

    <!-- Estimates Table Card -->
    <div class="card">
      <div class="card-body" style="padding: 0;">
        <div class="table-responsive">
          <table class="gov-table" style="width: 100%;">
            <thead>
              <tr>
                <th style="width: 90px;">Work ID</th>
                <th>Work Description & Details</th>
                <th style="width: 130px;">Amount</th>
                <th style="width: 160px;">Status</th>
                <th style="width: 140px;">Last Updated</th>
                <th style="width: 190px; text-align: center;">Actions</th>
              </tr>
            </thead>
            <tbody id="estimates-tbody">
              <tr>
                <td colspan="6" style="text-align: center; padding: 30px; color: #64748B;">
                  Loading estimates from server...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer Shell Container -->
  <div id="gov-app-footer"></div>

  <script>
    var allEstimates = [];
    var currentTab = 'all';

    document.addEventListener('DOMContentLoaded', async function () {
      var user = HMWSSB.Auth.requireLogin();
      if (!user) return;

      HMWSSB.UI.renderHeader('home');
      HMWSSB.UI.renderBreadcrumbs([
        { label: 'HMWSSB Works Portal', url: 'home-v2.html' },
        { label: 'My Estimates' }
      ]);
      HMWSSB.UI.renderFooter();

      // Check URL query param for initial tab
      var urlParams = new URLSearchParams(window.location.search);
      var reqTab = urlParams.get('tab') || urlParams.get('filter');
      if (reqTab && ['all', 'draft', 'returned', 'scrutiny', 'sanctioned'].indexOf(reqTab.toLowerCase()) !== -1) {
        currentTab = reqTab.toLowerCase();
      }

      await loadEstimates();
      updateTabButtons();
    });

    async function loadEstimates() {
      try {
        var user = HMWSSB.Auth.getUser();
        var isAdmin = (user.role || '').toUpperCase() === 'ADMIN';
        var list = await HMWSSB.API.getEstimates({ officerPhone: user.phoneNumber });

        allEstimates = list.filter(function (e) {
          if (isAdmin) return true;
          return e.officerPhone === user.phoneNumber || e.createdByPhone === user.phoneNumber || !e.officerPhone;
        });

        // Populate Division Filter
        var divisions = {};
        allEstimates.forEach(function (e) {
          if (e.division) divisions[e.division] = true;
        });
        var divSelect = document.getElementById('division-filter');
        divSelect.innerHTML = '<option value="">All Divisions</option>';
        Object.keys(divisions).sort().forEach(function (d) {
          var opt = document.createElement('option');
          opt.value = d;
          opt.textContent = 'Division ' + d;
          divSelect.appendChild(opt);
        });

        updateCounts();
        filterAndRender();
      } catch (err) {
        document.getElementById('estimates-tbody').innerHTML =
          '<tr><td colspan="6" style="text-align:center; padding:24px; color:#DC2626;">Failed to load estimates: ' + err.message + '</td></tr>';
      }
    }

    function updateCounts() {
      var counts = { all: allEstimates.length, draft: 0, returned: 0, scrutiny: 0, sanctioned: 0 };
      allEstimates.forEach(function (e) {
        var isRet = HMWSSB.Workflow.isReturned(e);
        if (e.status === 'APPROVED') counts.sanctioned++;
        else if (e.status === 'DRAFT') {
          if (isRet) counts.returned++;
          else counts.draft++;
        } else {
          counts.scrutiny++;
        }
      });

      document.getElementById('tab-count-all').textContent = counts.all;
      document.getElementById('tab-count-draft').textContent = counts.draft;
      document.getElementById('tab-count-returned').textContent = counts.returned;
      document.getElementById('tab-count-scrutiny').textContent = counts.scrutiny;
      document.getElementById('tab-count-sanctioned').textContent = counts.sanctioned;
    }

    function switchTab(tab, btn) {
      currentTab = tab;
      var buttons = document.querySelectorAll('.gov-tab-btn');
      buttons.forEach(function (b) { b.classList.remove('active'); });
      if (btn) btn.classList.add('active');
      filterAndRender();
    }

    function updateTabButtons() {
      var buttons = document.querySelectorAll('.gov-tab-btn');
      buttons.forEach(function (b) {
        b.classList.remove('active');
        if (b.getAttribute('onclick') && b.getAttribute('onclick').indexOf("'" + currentTab + "'") !== -1) {
          b.classList.add('active');
        }
      });
    }

    function resetFilters() {
      document.getElementById('search-input').value = '';
      document.getElementById('division-filter').value = '';
      filterAndRender();
    }

    function filterAndRender() {
      var search = (document.getElementById('search-input').value || '').toLowerCase().trim();
      var divFilter = document.getElementById('division-filter').value;

      var filtered = allEstimates.filter(function (est) {
        var isRet = HMWSSB.Workflow.isReturned(est);

        // Tab Filter
        if (currentTab === 'draft' && (est.status !== 'DRAFT' || isRet)) return false;
        if (currentTab === 'returned' && !isRet) return false;
        if (currentTab === 'scrutiny' && (est.status === 'DRAFT' || est.status === 'APPROVED')) return false;
        if (currentTab === 'sanctioned' && est.status !== 'APPROVED') return false;

        // Division Filter
        if (divFilter && est.division !== divFilter) return false;

        // Search Filter
        if (search) {
          var matchId = String(est.id || '').toLowerCase().indexOf(search) !== -1;
          var matchName = String(est.workName || '').toLowerCase().indexOf(search) !== -1;
          var matchFile = String(est.fileNumber || '').toLowerCase().indexOf(search) !== -1;
          if (!matchId && !matchName && !matchFile) return false;
        }

        return true;
      });

      var tbody = document.getElementById('estimates-tbody');
      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:32px; color:#64748B;">No estimates matching the current filter criteria.</td></tr>';
        return;
      }

      var user = HMWSSB.Auth.getUser();
      var isAdmin = (user.role || '').toUpperCase() === 'ADMIN';

      var rowsHtml = '';
      filtered.forEach(function (est) {
        var isRet = HMWSSB.Workflow.isReturned(est);
        var badge = HMWSSB.Formatting.getStatusBadge(est.status, isRet);
        var amt = HMWSSB.Formatting.formatCurrency(est.grandTotal || 0);
        var dateStr = HMWSSB.Formatting.formatDate(est.updatedAt || est.createdAt);
        var canDelete = (est.status === 'DRAFT' || isAdmin);

        rowsHtml += '<tr>';
        rowsHtml += '<td><b>#' + (est.id || 'NEW') + '</b></td>';
        rowsHtml += '<td>';
        rowsHtml += '  <div style="font-weight:700; color:#1E293B; font-size:13.5px;">' + (est.nameOfWork || est.workName || 'Untitled Work') + '</div>';
        rowsHtml += '  <div style="font-size:11px; color:#64748B; margin-top:2px;">';
        rowsHtml += '    File No: <b>' + (est.fileNumber || '—') + '</b> • Div: <b>' + (est.division || '—') + '</b> • Items: <b>' + (est.items ? est.items.length : 0) + '</b>';
        rowsHtml += '  </div>';

        // Prominent Return Reason Box if returned
        if (isRet) {
          rowsHtml += '  <div class="returned-reason-box" style="margin-top:6px; padding:6px 10px; background:#FEF2F2; border-left:3px solid #DC2626; border-radius:4px; font-size:11.5px; color:#991B1B;">';
          rowsHtml += '    <b>Scrutiny Return Remarks:</b> ' + (est.lastRemarks || 'Please review and modify measurements.');
          rowsHtml += '  </div>';
        }

        rowsHtml += '</td>';
        rowsHtml += '<td><b>' + amt + '</b></td>';
        rowsHtml += '<td>' + badge + '</td>';
        rowsHtml += '<td style="font-size:12px; color:#64748B;">' + dateStr + '</td>';
        rowsHtml += '<td class="table-actions-cell">';
        rowsHtml += '  <a href="measurement-v2.html?id=' + est.id + '" class="btn-table-action" title="Edit Estimate Sheet" style="margin-right:4px; display:inline-flex; align-items:center; gap:4px;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.3 8.7l-5-5a1 1 0 0 0-1.4 0l-12 12a1 1 0 0 0 0 1.4l5 5a1 1 0 0 0 1.4 0l12-12a1 1 0 0 0 0-1.4z"/><line x1="14.5" y1="5.5" x2="18.5" y2="9.5"/></svg> Estimate</a>';
        rowsHtml += '  <a href="abstract-v2.html?id=' + est.id + '" class="btn-table-action primary" title="View General Abstract" style="margin-right:4px; display:inline-flex; align-items:center; gap:4px;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> Abstract</a>';
        if (canDelete) {
          rowsHtml += '  <button class="btn btn-danger btn-sm" title="Delete Draft" onclick="confirmDeleteEstimate(' + est.id + ')" style="padding:4px 7px; font-size:11px; display:inline-flex; align-items:center;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button>';
        }
        rowsHtml += '</td>';
        rowsHtml += '</tr>';
      });

      tbody.innerHTML = rowsHtml;
    }

    function confirmDeleteEstimate(id) {
      if (!confirm('Are you sure you want to permanently delete draft estimate #' + id + '? This cannot be undone.')) return;
      HMWSSB.API.deleteEstimate(id).then(function () {
        HMWSSB.UI.showToast('Estimate #' + id + ' deleted successfully', 'success');
        loadEstimates();
      }).catch(function (err) {
        HMWSSB.UI.showToast('Failed to delete estimate: ' + err.message, 'error');
      });
    }
  </script>
</body>
</html>
